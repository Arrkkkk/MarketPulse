# Render Blueprint — one free web service, both processes in one container.
#
# Not the two-service, one-private design fly.toml and scripts/deploy_cloud_run.sh
# use: Render's free tier has no private-service option at all, and even a
# *free web* service "can't receive private network traffic" (Render's own
# free-tier docs) — so an API-as-a-second-service cannot be reached for
# free the way it can on Fly or (with an ID token) Cloud Run.
#
# scripts/start_combined.sh runs both processes in this one container
# instead: the API bound to 127.0.0.1 only — unreachable from outside the
# container by construction, which is actually stronger isolation than a
# private-network hop would give, not a compromise — and Streamlit public
# on whatever port Render expects. See docs/deploying.md for the trade-offs
# this makes (an idle service spins down, the cache resets each time it
# does) in exchange for costing nothing and needing no payment method.

services:
  - name: marketpulse
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/start_combined.sh
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # Render terminates TLS and forwards plain HTTP, same reasoning as
      # every other platform this project documents a deploy for: without
      # this, the rate limiter would see every request as coming from
      # Render's edge and throttle all users as one.
      - key: MARKETPULSE_TRUST_PROXY
        value: "1"
      # sync: false — Render prompts for each of these in the dashboard
      # when the blueprint is first created and stores them as secrets,
      # never in this file or in git. Every credential is optional, same
      # rule as everywhere else in this project: leave one blank and the
      # matching feature reports itself as unconfigured rather than
      # failing.
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
