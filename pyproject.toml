[project]
name = "marketpulse"
version = "0.1.0"
description = "Real-time stock and crypto market dashboard with AI-driven news analysis"
readme = "README.md"
requires-python = ">=3.11"

# Direct dependencies only. Transitive versions are pinned in uv.lock
# (`uv sync`) — do not add indirect packages here.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "streamlit>=1.47,<2",
    "streamlit-autorefresh>=1.0.1",
    "pandas>=2.2,<3",
    "plotly>=6.0,<7",
    "yfinance>=0.2.65,<0.3",
    "pycoingecko>=3.2,<4",
    "google-generativeai>=0.8.5,<0.9",
    "requests>=2.32,<3",
    "pydantic-settings>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only the package ships. app.py and the legacy api_utils/news_api_utils
# modules stay top-level scripts until Phase 3 folds them into marketpulse/ui.
[tool.hatch.build.targets.wheel]
packages = ["marketpulse"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["marketpulse", "tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["marketpulse"]
omit = ["*/test_*.py"]
